<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="shortcut icon" href="../../assets/images/logo.png" type="image/x-icon">
  <title>AI Chat - Schedule Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/chat.css">
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <header>
    <div class="logo">TW32</div>
    <div class="hamburger" id="hamburger">&#9776;</div>
    <nav id="sideNav" class="side-nav" aria-hidden="true">
      <button id="closeNav" class="close-nav">×</button>
      <ul>
        <li><a href="../../index.html">Home</a></li>
        <li><a href="../calendar/calendar.html">Calendar & Dashboard</a></li>
        <li><a href="chat.html">AI Chatbot</a></li>
        <li><a href="../workout/workout.html">Weekly Workout</a></li>
      </ul>
    </nav>
  </header>

  <main class="chat-page container py-4">
    <div class="chat-header d-flex align-items-center justify-content-between mb-3">
      <h2>AI Chatbot</h2>
    </div>

    <!-- n8n webhook inputs removed; Puter/local backends are used by default -->

    <div id="chatBox" class="chat-box card shadow-sm border-0 rounded-4 p-3" aria-live="polite"></div>

    <div class="chat-controls input-group mt-3">
      <input id="chatInput" type="text" class="form-control" placeholder="Ask about your schedule, tasks, or general questions..." />
      <button id="sendBtn" class="btn btn-success" aria-label="Send" title="Send">
        <!-- Paper plane icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
      <button id="resetBtn" class="btn btn-outline-secondary" aria-label="Reset chat" title="Reset chat">
        <!-- Trash can icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a1 1 0 0 1 1 1v1h5v2h-1v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7H3V5h5V4a1 1 0 0 1 1-1zm8 4H7v12h10V7zM9 9h2v8H9V9zm4 0h2v8h-2V9z"/></svg>
      </button>
    </div>
  </main>

  <script src="../../assets/js/schedule-data.js"></script>
  <script src="chat.js"></script>
  <script src="../../assets/js/site-nav.js"></script>
</body>
</html>
