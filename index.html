<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="./assets/images/logo.png" type="image/x-icon">
  <title>Home - Schedule Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
 

</head>
<body>

  <header>
    <img src="assets/images/logo.png" alt="Schedule Tracker Logo" class="header-logo" />
    <div class="hamburger" id="hamburger">&#9776;</div>
    <nav id="sideNav" class="side-nav" aria-hidden="true">
      <button id="closeNav" class="close-nav">×</button>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="pages/edit/edit.html">Edit Schedule</a></li>
        <li><a href="pages/calendar/calendar.html">Calendar & Dashboard</a></li>
        <li><a href="pages/chat/chat.html">AI Chatbot</a></li>
        <li><a href="pages/workout/workout.html">Weekly Workout</a></li>
      </ul>
    </nav>
  </header>

 <nav class="nav-bar">
  <p id="alertMessage">Hello, User</p>
  <p id="next-schedule">Next class: None</p>
</nav>

<!-- Main content: organized two-column layout -->
<section class="join container-fluid py-4 px-3 px-lg-4">
  <div class="left-col">
    <section class="day-details card shadow-sm border-0 rounded-4">
      <p id="date">Date: --/--/----</p>
      <p id="time">Time: 00:00:00</p>
      <p id="day">Day: Monday</p>
    </section>

    <section class="schedule card shadow-sm border-0 rounded-4">
      <select id="dayDropdown" class="day-dropdown" onchange="showSchedule(this.value, this)">
        <option value="Monday">Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
        <option value="Friday">Friday</option>
        <option value="Saturday">Saturday</option>
      </select>
    </section>

    <section id="scheduleViewerTab" class="schedule-tab-panel active card shadow-sm border-0 rounded-4 p-3" role="tabpanel">
      <section id="scheduleDisplay"></section>
    </section>
  </div>

  <aside class="right-col">
    <section class="mini-dashboard card shadow-sm border-0 rounded-4">
      <h3>Mini Dashboard</h3>
      <p>Selected date: <span id="miniSelectedDate">None</span></p>
      
      <ul id="miniUpcomingList"></ul>
    </section>

    <section class="note-of-day card shadow-sm border-0 rounded-4">
      <h3>Note of the Day (Checklist)</h3>
      <input type="text" id="taskInput" placeholder="Add a task..." />
      <button onclick="addTask()">Add</button>
      <ul id="taskList"></ul>
      <button onclick="downloadTasks()">Save Tasks to File</button>
    </section>
  </aside>
</section>

<footer>
  <a href="https://solar.feutech.edu.ph/user/profile" target="_blank" style="font-size:0.98rem;color:#388e3c;font-weight:500;text-decoration:none;">Go to FEU Tech Solar Profile</a>
</footer>

<!-- Load main script once -->
<script src="assets/js/schedule-data.js"></script>
<script src="assets/js/script.js"></script>
<script src="assets/js/site-nav.js"></script>


</body>
</html>
